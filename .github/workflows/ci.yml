---
# Rigor gate for tripper_recon.
#
# This repo shipped three merged PRs with nothing checking them (docs/ROADMAP.md W1).
# This workflow is that check. It gates four things, in increasing cost order:
#
#   1. ruff check          — lint
#   2. ruff format --check — formatting drift (never rewrites in CI; report only)
#   3. mypy                — type check
#   4. pytest              — the W0 regression net
#
# Gates 1-3 are BLOCKING for tests/ and ADVISORY (continue-on-error) for the
# package source, because the source predates any linter or type checker and
# W1 may not edit it. The counts and the flip-to-blocking condition are
# documented at the step itself. Gate 4 is blocking everywhere.
# Read that comment before "fixing" CI by deleting a step.
#
# Design constraints specific to this tool:
#   * The test suite MUST make zero network calls. A test that reaches the
#     network violates the passive-only contract in docs/OPSEC.md section 1.
#     CI runs with every provider credential explicitly unset so a test that
#     forgot its respx mock fails loudly instead of billing a real API key.
#   * No step here ever contacts an investigation target.

name: CI

on:
  push:
  pull_request:

# Read-only by default. Nothing in this workflow writes to the repo.
permissions:
  contents: read

# A new push to the same ref cancels the in-flight run for that ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + types + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      # Report every interpreter's result. A 3.10-only failure is information
      # we want on the same run, not on the next one.
      fail-fast: false
      matrix:
        # Mirrors requires-python = ">=3.10" and the classifiers in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # Action majors verified current on 2026-08-08 against the GitHub releases
      # API. checkout@v4 and setup-python@v5 still run, but both pin the Node 20
      # runtime and emit a deprecation warning on every job; v7 of each runs on
      # Node 24. Neither v7 changed an input this workflow uses.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # There is no requirements.txt; dependencies live in pyproject.toml,
          # so that is the file whose hash keys the pip cache.
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Record tool versions
        # ruff and mypy are floor-pinned (">=0.5", ">=1.10"), so the effective
        # rule set is whatever released most recently. Printing the resolved
        # versions makes a "CI went red and nobody touched the code" morning
        # diagnosable in one glance. See the report note on pinning these.
        run: |
          ruff --version
          mypy --version
          pytest --version

      # ------------------------------------------------------------------
      # Blocking gates. These cover what W1 actually delivered (the test
      # suite), so they are clean today and must stay clean.
      # ------------------------------------------------------------------

      - name: Lint tests (ruff check)
        run: ruff check tests/

      - name: Format check tests (ruff format --check)
        # --check only. CI never rewrites source; it reports the diff and fails.
        run: ruff format --check --diff tests/

      # ------------------------------------------------------------------
      # Advisory gates — package source. NON-BLOCKING ON PURPOSE.
      #
      # W1.7 in docs/ROADMAP.md specifies `ruff check`, `ruff format --check`
      # and `mypy tripper_recon/` repo-wide. Enabling all three as blocking
      # gates today makes CI red on the first push for reasons no W1 change
      # caused: the package source has never been linted or type-checked.
      # Measured on 2026-08-08 at the tip of this branch:
      #
      #     ruff check tripper_recon/       167 errors (130 autofixable)
      #     ruff format --check .            26 files would be reformatted
      #                                      (20 tripper_recon/, 6 docs/)
      #     mypy tripper_recon/              28 errors in 4 files
      #                                      (19 unused-ignore, 6 union-attr,
      #                                       1 var-annotated, 1 type-var,
      #                                       1 arg-type)
      #
      # W1 is a tests-and-CI workstream and is explicitly barred from editing
      # tripper_recon/, so those counts cannot be driven to zero here without
      # exceeding the workstream's mandate. Reporting them non-blocking keeps
      # the numbers visible on every run so they can ratchet down, instead of
      # either hiding the debt or training everyone to ignore a permanently
      # red pipeline.
      #
      # FLIP THESE TO BLOCKING (drop continue-on-error, restore the repo-wide
      # paths) in the workstream that cleans the package source. Most of the
      # ruff findings are `ruff check --fix` plus `ruff format`; the mypy
      # unused-ignore cluster is stale suppressions that delete cleanly.
      # ------------------------------------------------------------------

      - name: Lint package source (advisory — see comment above)
        continue-on-error: true
        run: ruff check tripper_recon/

      - name: Format check package source (advisory — see comment above)
        continue-on-error: true
        run: ruff format --check --diff tripper_recon/ docs/

      - name: Type check (advisory — see comment above)
        continue-on-error: true
        run: mypy tripper_recon/

      - name: Tests (pytest)
        env:
          # Every provider credential is explicitly blanked. The suite is
          # offline by contract; if a test escapes its respx mock it must fail
          # on a missing key, not succeed against a live paid API.
          VT_API_KEY: ""
          SHODAN_API_KEY: ""
          ABUSEIPDB_API_KEY: ""
          IPINFO_TOKEN: ""
          OTX_API_KEY: ""
          CLOUDFLARE_API_TOKEN: ""
        run: pytest -q

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Independent of the matrix: a credential in the history is a finding
    # regardless of which interpreter the code runs on.
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          # gitleaks scans commits, not just the working tree. A key that was
          # committed and then removed is still a key that leaked, and this
          # repo keeps paid provider credentials in a .env one directory from
          # the working tree (docs/OPSEC.md section 4).
          fetch-depth: 0

      - name: Run gitleaks
        # v3.0.0 is the current major (verified 2026-08-08). It is v2 on the
        # Node 24 runtime, with no input or behavior change.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action is free for public repositories and personal
          # accounts. If this repo ever moves under a GitHub organisation, the
          # action requires GITLEAKS_LICENSE — add it as a repository secret at
          # that point, or swap this step for the gitleaks container image.
