[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tripper-recon"
version = "0.1.0"
description = "Passive async OSINT IP/Domain/ASN investigation tool"
requires-python = ">=3.10"
authors = [{ name = "FancyP4nda" }]
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE"]
keywords = ["osint", "threat-intelligence", "security", "dfir", "soc", "passive-recon"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/FancyP4nda/tripper_recon"
Repository = "https://github.com/FancyP4nda/tripper_recon"
Issues = "https://github.com/FancyP4nda/tripper_recon/issues"
dependencies = [
  "httpx[http2]>=0.27.0",
  "pydantic>=2.6.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "python-dotenv>=1.0.1",
  "rich>=13.0.0",
]

[project.scripts]
tripper-recon = "tripper_recon.cli:main"
tripper-recon-api = "tripper_recon.api.server:run"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["tripper_recon*"]
exclude = ["tests*", "examples*", "docs*"]


