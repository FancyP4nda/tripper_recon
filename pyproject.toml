[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tripper-recon"
version = "0.1.0"
description = "Passive async OSINT IP/Domain/ASN investigation tool"
requires-python = ">=3.10"
authors = [{ name = "FancyP4nda" }]
readme = "README.md"
# PEP 639 SPDX expression. The older `license = { text = "MIT" }` table form is rejected outright
# by setuptools once `license-files` is also present -- `pip wheel .` failed with
# "`project.license` must be string" -- so the two keys could not both stand. The build was
# broken before this change and nothing downstream noticed, because no CI job builds the package.
license = "MIT"
license-files = ["LICENSE"]
keywords = ["osint", "threat-intelligence", "security", "dfir", "soc", "passive-recon"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  # No "License :: OSI Approved :: MIT License" classifier. PEP 639 supersedes it with the SPDX
  # `license` key above, and setuptools now hard-errors when both are present rather than
  # warning. The licence is declared once, in one place.
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

dependencies = [
  "httpx[http2]>=0.27.0",
  "pydantic>=2.6.0",
  "python-dotenv>=1.0.1",
  # The verdict ruleset and the known-infrastructure catalogue are YAML, not Python, because a
  # scoring constant living in a .py file is a defect (docs/review/design-verdict-engine.md §8.1).
  # verdict/config.py guards the import so a missing PyYAML fails with an actionable message
  # instead of an import traceback -- but it is a hard runtime requirement, not an extra: without
  # it no verdict can be computed at all.
  "pyyaml>=6.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/FancyP4nda/tripper_recon"
Repository = "https://github.com/FancyP4nda/tripper_recon"
Issues = "https://github.com/FancyP4nda/tripper_recon/issues"

[project.scripts]
tripper-recon = "tripper_recon.cli:main"

[tool.ruff]
line-length = 120
target-version = "py310"
# ruff >=0.16 formats Python code blocks inside Markdown. docs/ is evidence: the review reports
# and the roadmap quote source verbatim with file:line anchors, and reformatting those blocks
# silently rewrites the thing being cited. Never let the formatter touch them.
extend-exclude = ["docs/"]

[tool.ruff.lint]
# Selected explicitly. Without a `select` key ruff walks up the filesystem and can inherit a
# config from outside the repo, so a clean local run says nothing about CI. Pinning it here
# makes the check reproducible on any machine.
#
# E/W/F  pycodestyle + pyflakes  - real defects: unused imports and names, undefined names
# I      isort                   - deterministic import order, keeps diffs small
# B      flake8-bugbear          - mutable defaults, loop-variable capture, and similar traps
# SIM    flake8-simplify         - genuine simplifications
# UP (pyupgrade) is deliberately NOT selected. It would rewrite 132 typing.Dict/Optional
# annotations across every file. The codebase is internally consistent in the typing.* style,
# and churning it buys nothing while destroying blame history. Revisit as one deliberate commit.
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = [
  "E501",    # line length is enforced by the formatter, not the linter
  "SIM105",  # contextlib.suppress is not clearer than try/except on the error paths here
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately import fixtures they do not directly reference, and assert on constructs
# the linter reads as redundant.
"tests/*" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["tripper_recon*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
# scoring.yaml and known_infrastructure.yaml are loaded through importlib.resources at runtime,
# so an installed wheel that omits them produces a tool that imports fine and then refuses to
# adjudicate anything. Declared explicitly rather than relying on include-package-data, which is
# MANIFEST/VCS-driven and silently drops files a plugin does not know about.
# Checked: .gitignore has no *.yaml or *.yml rule, so neither file is swallowed
# (`git check-ignore` on both exits 1).
"tripper_recon.verdict" = ["*.yaml"]


