# ---------------------------------------------------------------------------------------------
# Deliberately omitted, with the reason
# ---------------------------------------------------------------------------------------------
# Read this before adding anything. Each of these was considered and left out on the merits, and
# every one of them is a case where a longer list would have been a worse list.
deliberately_omitted:
  - what: TLD nameservers (gtld-servers.net and the ccTLD sets)
    why: >-
      Named in the roadmap for Tier A, but no single publisher endpoint enumerates them. Deriving
      them means parsing the root zone, which is a build-time pipeline rather than a retrieval,
      and a partial hand-copied list is worse than none because the gaps are invisible.
    source_if_added: "https://www.internic.net/domain/root.zone"

  - what: AWS, GCP and Azure IP ranges
    why: >-
      Each publisher offers a machine-readable list, and each list is thousands of prefixes that
      change on a weekly or daily cadence. A snapshot in this file would be stale within days and
      would keep suppressing signal on ranges the provider had already handed back. ASN matching
      gives the same cap with a fraction of the rot.
    source_if_added: >-
      https://ip-ranges.amazonaws.com/ip-ranges.json, https://www.gstatic.com/ipranges/cloud.json,
      Azure service tag download

  - what: Googlebot published ranges
    why: >-
      The published file carried a creationTime one day before retrieval and holds over three
      hundred prefixes, so it is a list that genuinely churns. Vendoring a fast-moving snapshot to
      suppress abuse signals is the exact stale-allowlist failure this catalogue is built to avoid,
      and Googlebot's ASN is Google's whole production network so ASN matching is not a substitute.
    source_if_added: "https://developers.google.com/static/search/apis/ipranges/googlebot.json"

  - what: Shodan scanner ranges
    why: >-
      Widely circulated as community gists and blocklists, with no publisher-maintained list to
      check them against. Unsourced, so excluded.
    source_if_added: null

  - what: OpenDNS IPv6 resolver addresses
    why: >-
      In wide circulation but not found on a Cisco- or OpenDNS-published page during retrieval.
      Excluded rather than carried on the strength of third-party repetition.
    source_if_added: null

  - what: A denylist of named low-quality VirusTotal engines
    why: >-
      Out of scope here and explicitly refused for the project: no measured basis exists, and
      shipping an unsourced list of named vendors is both wrong and a liability. Engine weighting
      comes from a labelled corpus or it does not exist.
    source_if_added: null
