# Known-infrastructure override catalogue -- roadmap 5.6.
#
# This file is DATA. Nothing here is tuned, fitted, or inferred: every address range and every
# ASN below was retrieved from the party that publishes it, on the date recorded in the entry,
# and the URL that produced it is recorded beside it. An entry that could not be verified against
# a publisher or a registry is NOT in this file -- it is listed under `deliberately_omitted` with
# the reason, because an unsourced allowlist entry is a silent false-negative generator and that
# is the worst failure this tool has available to it.
#
# WHAT THE THREE TIERS DO, AND WHY THE B/A DISTINCTION IS THE IMPORTANT ONE
#
#   Tier A -- absolute. Public DNS resolvers and root nameservers. FORCES the verdict to
#     KNOWN_INFRASTRUCTURE and short-circuits scoring. This is the ONLY path in the whole engine
#     to a benign conclusion, and it is a human decision with a citation rather than anything
#     scoring can reach. These addresses carry permanent nonzero VirusTotal and AbuseIPDB residue
#     from DNS tunnelling and scanning reports; a tool that calls 1.1.1.1 malicious even once is
#     finished, because the analyst stops believing every other verdict it ever produces.
#
#   Tier B -- CDN and major cloud. Does NOT force benign, and the difference from Tier A is the
#     whole design. Shared hosting is where malware actually lives. Tier B zeroes the signals
#     that describe the *edge* rather than the *tenant* (ASN reputation, ASN hijack history,
#     Shodan exposure), caps the IP-level verdict at SUSPICIOUS, attaches an attribution warning,
#     and leaves DOMAIN-level scoring completely untouched. Both failure modes are real and this
#     is the only shape that avoids both: too strong and every phishing site behind Cloudflare
#     reads clean; too weak and every CDN address reads suspicious.
#
#   Tier C -- vendor scanners and known benign crawlers. Suppresses the abuse-report signals that
#     these hosts accumulate *as a property of what they do*, attaches a note, and forces nothing.
#     An internet-wide scanner collects abuse reports by definition; that is not evidence about
#     the scanner, and it is also not a reason to call the scanner safe.
#
# STALENESS IS THE FAILURE MODE THIS FILE IS BUILT AROUND.
# A range that a publisher has since returned or reassigned keeps matching here forever and
# silently suppresses signal on whatever moved in. There is no way to prevent that in a shipped
# snapshot, so the design goal is that it is DETECTABLE instead: every entry carries `retrieved`,
# the loader carries the oldest retrieval date of the entries that actually matched into every
# verdict, and `max_age_days` below turns that into a visible `stale: true` flag. Read the flag.
#
# NO LIVE FETCH ON THE ANALYSIS PATH. These lists are published at machine-readable endpoints and
# it is tempting to refresh them at lookup time. Do not: it is an outbound request per
# investigation, it fails open in exactly the situation where the analyst is under pressure, and
# it puts a third party on the critical path of a verdict. Refresh is a deliberate maintenance
# action that edits this file and bumps `version`.

version: "2026-08-08.1"

# When this snapshot was assembled. Individual entries carry their own `retrieved` date; this is
# the catalogue-level date reported when a lookup matches nothing, so an old file is still
# visible on a miss.
retrieved: 2026-08-08

# Beyond this age an entry is reported as stale in the verdict that used it. 180 days is a
# maintenance cadence, not a measurement -- it is the point at which a CDN range list should be
# assumed to have drifted, and it is deliberately shorter than the entries whose contents almost
# never change (root nameservers) would need.
max_age_days: 180

# ---------------------------------------------------------------------------------------------
# Tier policy -- what a match in each tier does
# ---------------------------------------------------------------------------------------------
# Signal ids referenced here are the ones defined in scoring.yaml `signals:`. They are names, not
# numbers; no weight, threshold or decay constant lives in this file or in known_infrastructure.py.
#
# PRECEDENCE NOTE. Where the packaged scoring.yaml `overrides:` block also states tier policy
# (cap verdict, zeroed signals, precedence order), scoring.yaml is the ruleset and wins. This
# block is the default so that the catalogue is usable on its own and so that its meaning is
# legible next to the data it governs.
tiers:
  A:
    label: absolute allowlist
    # The one verdict label that means "this is fine", reachable only from here.
    forces_verdict: KNOWN_INFRASTRUCTURE
    caps_verdict: null
    zeroed_signals: []
    suppressed_signals: []
    # IP scope only. A domain that happens to resolve to a public resolver is not thereby a
    # public resolver, and forcing a domain verdict from an address match would be exactly the
    # transfer-of-verdict error Tier B exists to prevent.
    applies_to: [ip]
    attribution_warning: null
    note: >-
      Address is published infrastructure whose operator is not the adversary. Adverse reports
      against it describe traffic that passed through it, not the operator of it.

  B:
    label: CDN and major cloud
    forces_verdict: null
    caps_verdict: SUSPICIOUS
    # The ASN describes the CDN, not the tenant; the Shodan surface is the edge, not the origin.
    zeroed_signals: [asn.reputation, asn.bgp_incidents, shodan.exposure]
    suppressed_signals: []
    applies_to: [ip]
    attribution_warning: >-
      Shared infrastructure. This verdict does not transfer between the address and the domains
      hosted on it -- do not block the address on the strength of a domain-level finding, and do
      not read a clean address as clearing the domain.
    note: >-
      Address belongs to a shared CDN or cloud provider. Reputation attached to the address is
      attributable to a tenant that cannot be identified from the address alone.

  C:
    label: vendor scanner or benign crawler
    forces_verdict: null
    caps_verdict: null
    zeroed_signals: []
    # Default for the tier; an entry may narrow or widen it with its own `suppresses:` list.
    # Only the abuse-report signals are suppressed. VirusTotal detections and OTX pulses are NOT
    # suppressed: a scanner range that starts serving malware is a real event and must still
    # score.
    suppressed_signals: [abuseipdb.confidence, abuseipdb.volume_recency]
    applies_to: [ip]
    attribution_warning: null
    note: >-
      Address belongs to declared scanning or crawling infrastructure. Abuse reports against it
      are an expected consequence of that activity and are not evidence of compromise. This is
      not a statement that the address is safe.

